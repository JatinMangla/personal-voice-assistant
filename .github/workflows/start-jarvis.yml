# The "Start Jarvis" button. On your phone: GitHub app (or github.com) -> this repo ->
# Actions -> Start Jarvis -> Run workflow. Free for private repos; each run takes <1 min.
name: Start Jarvis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q kaggle
      - run: python scripts/start_jarvis.py
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || vars.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          JARVIS_NOTEBOOK: ${{ vars.JARVIS_NOTEBOOK || 'jarvis' }}
          JARVIS_EXTRA: ${{ vars.JARVIS_EXTRA || '' }}

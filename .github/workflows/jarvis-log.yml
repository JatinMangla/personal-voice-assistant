# "Jarvis log" button: shows the status and the end of the log of the last Kaggle run,
# without opening Kaggle. GitHub -> Actions -> Jarvis log -> Run workflow, then open the run.
name: Jarvis log

on:
  workflow_dispatch:
    inputs:
      lines:
        description: "How many log lines to show"
        default: "200"

permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q kaggle
      - run: python scripts/kaggle_log.py "${{ inputs.lines }}"
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || vars.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          JARVIS_NOTEBOOK: ${{ vars.JARVIS_NOTEBOOK || 'jarvis' }}

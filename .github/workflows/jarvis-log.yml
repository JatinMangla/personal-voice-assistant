# "Jarvis log" button: shows the status and the end of the log of the last Kaggle run,
# without opening Kaggle. GitHub -> Actions -> Jarvis log -> Run workflow, then open the run.
name: Jarvis log

on:
  workflow_dispatch:
    inputs:
      lines:
        description: "How many log lines to show"
        default: "200"
      notebook:
        description: "Which notebook's last run to show: empty = Jarvis, or type coder"
        default: ""

permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q kaggle==2.2.5
      # Through env, never ${{ }} inside the command: typed text would run as shell code.
      - run: python scripts/kaggle_log.py "$LINES"
        env:
          LINES: ${{ inputs.lines }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || vars.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          JARVIS_NOTEBOOK: ${{ inputs.notebook || vars.JARVIS_NOTEBOOK || 'jarvis' }}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<title>Jarvis</title>
<style>
  :root {
    --bg: #f6f7f9; --fg: #16181d; --muted: #6b7280; --card: #ffffff;
    --accent: #2563eb; --listen: #dc2626; --think: #d97706; --speak: #059669;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #eceef2; --muted: #9aa1ad; --card: #181b21;
            --border: #262a33; }
  }
  * { box-sizing: border-box; }
  /* App shell: the page itself never scrolls (no body scrollbar on any device); the
     layout is pinned to the screen edges, and ONLY the chat (#log) scrolls. */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; }
  main { position: fixed; inset: 0; margin: 0 auto; width: 100%; max-width: 640px;
    display: flex; flex-direction: column; overflow: hidden;
    padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  .top { flex: none; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; }
  h1 { font-size: 20px; margin: 0; flex: none; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; min-width: 0; }
  .meta.bad { color: var(--listen); }
  .limits { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; margin-top: 8px;
    font-size: 11px; color: var(--muted); }
  @media (min-width: 480px) { .limits { grid-template-columns: repeat(4, 1fr); } }
  .limit .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 3px; }
  .limit .bar i { display: block; height: 100%; background: var(--accent); }
  .limit.warn { color: var(--listen); font-weight: 600; }
  .limit.warn .bar i { background: var(--listen); }
  #warn { display: none; margin-top: 10px; padding: 8px 12px; border-radius: 10px; font-size: 14px;
    background: rgba(220, 38, 38, .12); color: var(--listen); }
  #log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px 2px;
    display: flex; flex-direction: column; gap: 10px; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch; }
  #log > * { max-width: 100%; flex: none; }
  .msg { padding: 10px 14px; border-radius: 14px; max-width: 88%; white-space: pre-wrap;
    overflow-wrap: anywhere; }
  .you { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--card); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; }
  .hint { color: var(--muted); text-align: center; font-size: 14px; margin: auto 0; }
  /* link preview cards (like WhatsApp) */
  .links { align-self: flex-start; display: flex; flex-direction: column; gap: 8px; width: min(100%, 420px); }
  .card { display: flex; gap: 10px; align-items: stretch; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); background: var(--card); color: var(--fg); text-decoration: none; }
  .card .thumb { width: 96px; min-height: 72px; object-fit: cover; flex: none; background: var(--border); }
  .card .body { padding: 8px 10px 8px 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .card:not(:has(.thumb)) .body { padding-left: 12px; }
  .card .site { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .title { font-size: 14px; font-weight: 600; color: var(--accent); overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .snippet { font-size: 12px; color: var(--muted); overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .price { align-self: flex-start; font-size: 13px; font-weight: 700; color: #fff;
    background: var(--speak); border-radius: 6px; padding: 1px 7px; margin-top: 2px; }
  .card.video.top { flex-direction: column; gap: 0; }
  .card.video.top .thumb { width: 100%; height: auto; aspect-ratio: 16 / 9; }
  .card.video.top .body { padding: 8px 12px; }
  .play { align-self: flex-start; margin-top: 6px; padding: 6px 14px; border-radius: 999px; font-weight: 600;
    background: #dc2626; color: #fff; font-size: 14px; }
  /* header buttons, screen sharing */
  .actions { display: flex; gap: 6px; align-items: center; flex: none; }
  .chip { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--fg); }
  .chip.on { background: var(--listen); border-color: var(--listen); color: #fff; }
  .chip[hidden] { display: none; }
  #screenPreview { display: block; max-height: 70px; max-width: 140px; border-radius: 8px;
    border: 2px solid var(--listen); margin: 8px auto 0; }
  #screenPreview[hidden] { display: none; }
  .note { align-self: flex-start; max-width: 88%; font-size: 13px; color: var(--muted); }
  .rate { align-self: flex-start; display: flex; gap: 6px; margin-top: -4px; }
  .rate button { font-size: 15px; line-height: 1; padding: 6px 10px; border-radius: 999px; cursor: pointer;
    background: transparent; border: 1px solid var(--border); opacity: .6; }
  .rate button.on { opacity: 1; border-color: var(--accent); background: var(--card); }
  /* bottom bar: status on top, then [Whisper] (mic) [Start] in one row */
  .controls { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 6px 14px; padding-top: 8px; border-top: 1px solid var(--border); }
  .controls .left { justify-self: end; }
  .controls .right { justify-self: start; }
  #mic { width: 72px; height: 72px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #fff; display: grid; place-items: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); transition: transform .1s, background .2s; }
  #mic:active { transform: scale(.96); }
  #mic:disabled { opacity: .45; cursor: default; }
  #mic svg { width: 32px; height: 32px; }
  body[data-state="listening"] #mic { background: var(--listen); animation: pulse 1.2s infinite; }
  body[data-state="thinking"] #mic { background: var(--think); }
  body[data-state="speaking"] #mic { background: var(--speak); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,.45); }
                     50% { box-shadow: 0 0 0 16px rgba(220,38,38,0); } }
  @media (prefers-reduced-motion: reduce) { body[data-state="listening"] #mic { animation: none; } }
  #status { grid-column: 1 / -1; font-size: 14px; color: var(--muted); min-height: 1.4em;
    text-align: center; }
  .start { display: inline-block; padding: 6px 14px; border-radius: 999px; background: var(--speak);
    color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .start[hidden] { display: none; }
  .controls .left, .controls .right { min-width: 0; }
  #quiet { white-space: nowrap; }

  /* --- responsive ---------------------------------------------------------------- */
  /* small phones */
  @media (max-width: 360px) {
    h1 { font-size: 18px; }
    .chip { font-size: 12px; padding: 4px 8px; }
    .limits { font-size: 10px; gap: 4px 10px; }
    #mic { width: 60px; height: 60px; }
    #mic svg { width: 26px; height: 26px; }
    .controls { gap: 4px 10px; }
    .card .thumb { width: 76px; }
  }
  /* phones held sideways / short screens: keep the chat usable */
  @media (max-height: 520px) {
    .limits, #screenPreview { display: none !important; }
    #mic { width: 52px; height: 52px; }
    #mic svg { width: 24px; height: 24px; }
    #status { font-size: 13px; min-height: 1.2em; }
    #log { padding: 6px 2px; }
  }
  /* tablets and laptops */
  @media (min-width: 768px) {
    main { max-width: 760px; }
    .msg { max-width: 75%; }
    #mic { width: 76px; height: 76px; }
    #log { padding: 16px 4px; }
  }
</style>
</head>
<body data-state="ready">
<main>
  <div class="top">
    <header>
      <div class="brand"><h1 id="name">Jarvis</h1><span id="saved" class="meta">not saved yet</span></div>
      <div class="actions">
        <button id="share" class="chip" hidden title="Jarvis sees a snapshot of your screen each time you ask (laptop/desktop only)">🖥 Share screen</button>
        <button id="clear" class="chip" title="Clears this screen only; Jarvis's memory is kept">Clear</button>
      </div>
    </header>
    <div class="limits" id="limits" title="Free limits: a warning at 90%, automatic stop at 99%, so it never costs anything"></div>
    <div id="warn" role="alert"></div>
    <video id="screenPreview" muted playsinline hidden aria-label="Your shared screen"></video>
  </div>
  <div id="log" aria-live="polite"><p class="hint" id="hint">Tap the mic and speak. It stops listening when you pause.</p></div>
  <div class="controls">
    <div id="status">Tap to talk</div>
    <div class="left">
      <button id="quiet" class="chip" aria-pressed="false"
        title="For speaking softly (e.g. at night): Jarvis listens more sensitively">🤫 Whisper</button>
    </div>
    <button id="mic" aria-label="Tap to talk">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <div class="right">
      <a id="start" class="start" hidden target="_blank" rel="noopener noreferrer"
         title="Opens your GitHub Start page: tap 'Run workflow' there">▶ Start</a>
    </div>
  </div>
</main>
<script>
const HEADERS = { "ngrok-skip-browser-warning": "1" };
const $ = (id) => document.getElementById(id);
let stream = null, micCtx = null, recorder = null, chunks = [];
let playQueue = Promise.resolve(), stopCurrent = null, turnId = 0, closed = false;

// Replies play through a normal <audio> player as MEDIA, and the microphone is
// released as soon as you stop talking. While a page holds the mic, phones switch
// to "phone call" audio: sound goes to the earpiece and Bluetooth drops to call
// quality. Releasing it sends replies to the loudspeaker / Bluetooth media.
const player = new Audio();
player.preload = "auto";
const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";
let playerUnlocked = false;

function unlockPlayer() {  // phones only allow playback that starts from a tap
  if (playerUnlocked) return;
  playerUnlocked = true;
  player.src = SILENT_WAV;
  player.play().catch(() => { playerUnlocked = false; });
}

function setAudioSession(type) {  // iPhone/iPad Safari 16.4+: "playback" = speaker
  try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {}
}

let micReleasedAt = 0;
function releaseMic() {
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  if (micCtx) { micCtx.close().catch(() => {}); micCtx = null; }
  setAudioSession("playback");
  micReleasedAt = Date.now();
}

function setState(state, text) {
  document.body.dataset.state = state;
  $("status").textContent = text;
}

function addMsg(who, text) {
  $("hint")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

function ping() { fetch("api/ping", { method: "POST", headers: HEADERS }).catch(() => {}); }

// ---------- playback: sentences play one after another ----------
function stopPlayback() {
  turnId++;
  playQueue = Promise.resolve();
  player.pause();
  if (stopCurrent) { stopCurrent(); stopCurrent = null; }
}

function enqueueAudio(b64OrBuffer, myTurn) {
  playQueue = playQueue.then(async () => {
    if (myTurn !== turnId || !b64OrBuffer) return;
    const bytes = typeof b64OrBuffer === "string"
      ? Uint8Array.from(atob(b64OrBuffer), c => c.charCodeAt(0)) : new Uint8Array(b64OrBuffer);
    const isWav = bytes[0] === 0x52 && bytes[1] === 0x49;  // "RI"FF
    const url = URL.createObjectURL(new Blob([bytes], { type: isWav ? "audio/wav" : "audio/mpeg" }));
    // Give the phone a moment to switch audio back from the mic before playing.
    const sinceMic = Date.now() - micReleasedAt;
    if (sinceMic < 600) await new Promise((r) => setTimeout(r, 600 - sinceMic));
    setState("speaking", "Speaking… tap to interrupt");
    try {
      await new Promise((resolve) => {
        stopCurrent = resolve;
        player.onended = resolve;
        player.onerror = resolve;
        player.src = url;
        player.play().catch(resolve);
      });
    } finally {
      URL.revokeObjectURL(url);
    }
  }).catch(() => {});
  return playQueue;
}

// ---------- recording with automatic stop on silence ----------
async function startListening() {
  stopPlayback();
  setAudioSession("play-and-record");
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      // Noise suppression can remove whispered sounds, so it is off in Whisper mode.
      // echoCancellation OFF on purpose: on phones it switches audio into "phone call"
      // mode, which sends replies to the earpiece. Jarvis never listens while it speaks,
      // so there is no echo to cancel, and replies stay normal media: loudspeaker, or
      // wired / Bluetooth headphones when they are connected.
      audio: { echoCancellation: false, noiseSuppression: !quietMode, autoGainControl: true } });
  } catch (e) {
    releaseMic();
    setState("ready", "Microphone blocked. Allow mic access for this site and try again.");
    return;
  }
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (micCtx.state === "suspended") await micCtx.resume();
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = onRecordingDone;
  recorder.start(250);
  setState("listening", "Listening… (tap to stop)");
  watchSilence();
}

function watchSilence() {
  const source = micCtx.createMediaStreamSource(stream);
  const analyser = micCtx.createAnalyser();
  analyser.fftSize = 1024;
  source.connect(analyser);
  const data = new Float32Array(analyser.fftSize);
  const started = performance.now();
  let noise = 0.01, speechMs = 0, silenceMs = 0, last = started;
  recorder.heard = false;

  const timer = setInterval(() => {
    if (!recorder || recorder.state !== "recording") { clearInterval(timer); source.disconnect(); return; }
    analyser.getFloatTimeDomainData(data);
    let sum = 0; for (const v of data) sum += v * v;
    const rms = Math.sqrt(sum / data.length);
    const now = performance.now(), dt = now - last; last = now;
    const elapsed = now - started;
    if (elapsed < 300) { noise = Math.max(noise, rms); return; }   // learn background noise
    // What counts as speech: a bit above the background noise. The mic is opened fresh
    // for every question, so its automatic gain starts low: keep the bar low too.
    // Whisper mode: even lower bar, and a longer pause before it stops listening.
    const loud = quietMode ? rms > Math.max(0.004, noise * 1.8) : rms > Math.max(0.008, noise * 2.2);
    if (loud) { speechMs += dt; silenceMs = 0; } else { silenceMs += dt; }
    if (speechMs > 200) recorder.heard = true;
    const pauseMs = quietMode ? 1600 : 1200;
    if ((recorder.heard && silenceMs > pauseMs) || (!recorder.heard && elapsed > 8000) || elapsed > 30000) {
      recorder.stop();
    }
  }, 50);
}

async function onRecordingDone() {
  const heard = recorder.heard;
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  recorder = null;
  releaseMic();  // back to media audio: loudspeaker / Bluetooth music quality
  if (!heard) { setState("ready", "Didn't hear anything. Tap to try again."); return; }
  if (blob.size < 1500) { setState("ready", "The recording failed. Tap to try again."); return; }
  await sendTurn(blob);
}

// ---------- send audio, read streamed reply ----------
async function sendTurn(blob) {
  const myTurn = ++turnId;
  setState("thinking", "Thinking…");
  let youMsg = null, botMsg = null;
  try {
    let usedScreen = false;
    if (screenStream) {  // screen sharing: send a snapshot for this question first
      const shot = await snapshot();
      if (shot) {
        const r = await fetch("api/screen", { method: "POST", body: shot,
          headers: { ...HEADERS, "Content-Type": "image/jpeg" } }).catch(() => null);
        usedScreen = !!(r && r.ok);
      }
    }
    const res = await fetch("api/turn", { method: "POST", body: blob,
      headers: { ...HEADERS, "Content-Type": blob.type, "X-Quiet": quietMode ? "1" : "0" } });
    if (res.status === 409) { setState("ready", "Busy or closing. Try again in a moment."); return; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "transcript") {
          if (ev.text) youMsg = addMsg("you", ev.text + (usedScreen ? "  🖥" : ""));
        } else if (ev.type === "sentence") {
          if (!botMsg) botMsg = addMsg("bot", ev.text);
          else botMsg.textContent += " " + ev.text;
          $("log").scrollTop = $("log").scrollHeight;
          enqueueAudio(ev.audio, myTurn);
        } else if (ev.type === "done" && !ev.heard) {
          setState("ready", "Didn't catch that. Tap to try again.");
          return;
        } else if (ev.type === "links") {
          addLinks(ev.links);
        } else if (ev.type === "done" && ev.turn_id) {
          addRating(ev.turn_id);
        }
      }
    }
    await playQueue;
    if (myTurn === turnId) setState("ready", "Tap to talk");
  } catch (e) {
    if (myTurn === turnId) setState("ready", "Connection problem. Tap to try again.");
  }
}

$("mic").addEventListener("click", () => {
  unlockPlayer();  // must happen inside the tap itself
  if (closed || offline) { reconnect(); return; }
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  startListening();
});

// ---------- links found on the internet: preview cards (never read aloud) ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function addLinks(links) {
  const box = el("div", "links");
  let firstVideo = true;
  for (const l of links) {
    if (!/^https?:\/\//i.test(l.url)) continue;  // web links only
    const isVideo = l.kind === "video" && /^[\w-]{11}$/.test(l.video_id || "");
    const card = el("a", "card" + (isVideo ? " video" : "") + (isVideo && firstVideo ? " top" : ""));
    card.href = l.url; card.target = "_blank"; card.rel = "noopener noreferrer";
    if (l.image && /^https:\/\//i.test(l.image)) {
      const img = el("img", "thumb");
      img.src = l.image; img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
      img.onerror = () => img.remove();
      card.appendChild(img);
    }
    const body = el("div", "body");
    body.appendChild(el("div", "site", [l.site, l.kind === "product" ? "" : l.note].filter(Boolean).join(" · ")));
    body.appendChild(el("div", "title", l.title));
    if (l.price) body.appendChild(el("span", "price", l.price));
    if (l.snippet) body.appendChild(el("div", "snippet", l.snippet));
    if (isVideo && firstVideo) body.appendChild(el("span", "play", "▶ Play on YouTube"));
    card.appendChild(body);
    if (isVideo) {
      card.addEventListener("click", (e) => { e.preventDefault(); openVideo(l.video_id); });
      firstVideo = false;
    }
    box.appendChild(card);
  }
  if (box.childElementCount) { $("log").appendChild(box); $("log").scrollTop = $("log").scrollHeight; }
}

// Open a YouTube video in the YouTube app if it is installed, otherwise in the browser.
// (A web page can't list installed apps; these links let the phone decide.)
function openVideo(id) {
  const web = "https://www.youtube.com/watch?v=" + id;
  const ua = navigator.userAgent;
  if (/Android/i.test(ua)) {
    // Android: opens the YouTube app, or the browser fallback if the app is missing.
    location.href = "intent://www.youtube.com/watch?v=" + id + "#Intent;scheme=https;" +
      "package=com.google.android.youtube;S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    // iPhone: try the app; if we're still here after 1.5 s, it isn't installed.
    const fallback = setTimeout(() => { if (!document.hidden) location.href = web; }, 1500);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) clearTimeout(fallback);
    }, { once: true });
    location.href = "youtube://www.youtube.com/watch?v=" + id;
  } else {
    window.open(web, "_blank", "noopener");
  }
}

// ---------- Whisper mode: for speaking softly (remembered on this device) ----------
let quietMode = false;
try { quietMode = localStorage.getItem("pva_quiet") === "1"; } catch (e) {}
function showQuiet() {
  $("quiet").classList.toggle("on", quietMode);
  $("quiet").setAttribute("aria-pressed", String(quietMode));
  $("quiet").textContent = quietMode ? "🤫 Whisper: on" : "🤫 Whisper";
}
$("quiet").addEventListener("click", () => {
  quietMode = !quietMode;
  try { localStorage.setItem("pva_quiet", quietMode ? "1" : "0"); } catch (e) {}
  showQuiet();
});
showQuiet();

// ---------- clear the chat on this screen (memory is not touched) ----------
$("clear").addEventListener("click", () => {
  $("log").replaceChildren(el("p", "hint", "Chat cleared. Jarvis still remembers everything. Tap the mic to talk."));
  $("log").lastChild.id = "hint";
});

// ---------- screen sharing (laptop/desktop browsers; phones don't allow it) ----------
let screenStream = null;
const screenVideo = $("screenPreview");
const canShareScreen = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)
  && !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
$("share").hidden = !canShareScreen;

$("share").addEventListener("click", async () => {
  if (screenStream) { stopSharing(); return; }
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 2 }, audio: false });
  } catch (e) { return; }  // cancelled
  screenVideo.srcObject = screenStream;
  screenVideo.hidden = false;
  screenVideo.play().catch(() => {});
  screenStream.getVideoTracks()[0].addEventListener("ended", stopSharing);  // browser's own Stop
  $("share").textContent = "⏹ Stop sharing";
  $("share").classList.add("on");
  addNote("🖥 Sharing your screen: each time you ask, Jarvis looks at it once. Nothing is recorded or saved.");
});

function stopSharing() {
  if (screenStream) screenStream.getTracks().forEach((t) => t.stop());
  screenStream = null;
  screenVideo.srcObject = null;
  screenVideo.hidden = true;
  $("share").textContent = "🖥 Share screen";
  $("share").classList.remove("on");
}

// One snapshot of the shared screen, max 1280 px wide, as JPEG.
async function snapshot() {
  if (!screenStream || !screenVideo.videoWidth) return null;
  const scale = Math.min(1, 1280 / screenVideo.videoWidth);
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(screenVideo.videoWidth * scale);
  canvas.height = Math.round(screenVideo.videoHeight * scale);
  canvas.getContext("2d").drawImage(screenVideo, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.7));
}

function addNote(text) {
  const note = document.createElement("div");
  note.className = "note";
  note.textContent = text;
  $("log").appendChild(note);
  $("log").scrollTop = $("log").scrollHeight;
}

// ---------- 👍 / 👎 on each reply: 👍 replies teach the assistant your style later ----------
function addRating(turnId) {
  const row = document.createElement("div");
  row.className = "rate";
  for (const [value, label, name] of [[1, "👍", "Good reply"], [-1, "👎", "Bad reply"]]) {
    const b = document.createElement("button");
    b.textContent = label; b.setAttribute("aria-label", name);
    b.addEventListener("click", async () => {
      const current = row.dataset.value === String(value) ? 0 : value;  // tap again to undo
      const r = await fetch("api/rate", { method: "POST",
        headers: { ...HEADERS, "Content-Type": "application/json" },
        body: JSON.stringify({ turn_id: turnId, value: current }) }).catch(() => null);
      if (r && r.ok) {
        row.dataset.value = String(current);
        row.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
        if (current) b.classList.add("on");
      }
    });
    row.appendChild(b);
  }
  $("log").appendChild(row);
  $("log").scrollTop = $("log").scrollHeight;
}

// ---------- free limits: bars, and a red banner from 90 % ----------
const LIMIT_LABELS = { day: "GPU today", week: "GPU last 7 days",
                       requests: "Link requests (month)", data: "Link data (month)" };
function limitText(m) {
  if (m.name === "day") return `${Math.round(m.used / 60)} / ${Math.round(m.limit / 60)} min`;
  if (m.name === "week") return `${(m.used / 3600).toFixed(1)} / ${Math.round(m.limit / 3600)} h`;
  if (m.name === "data") return `${Math.round(m.used / 1e6)} / ${Math.round(m.limit / 1e6)} MB`;
  return `${m.used.toLocaleString()} / ${m.limit.toLocaleString()}`;
}
function renderLimits(s) {
  const box = $("limits");
  box.replaceChildren(...s.meters.map((m) => {
    const div = document.createElement("div");
    div.className = "limit" + (m.percent >= s.notify_pct ? " warn" : "");
    div.textContent = `${LIMIT_LABELS[m.name]}: ${limitText(m)}`;
    if (m.resets) div.title = m.resets;  // e.g. "Resets at 12:00 AM (midnight) India time, in 3 h 20 min."
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("i"); fill.style.width = Math.min(100, m.percent) + "%";
    bar.appendChild(fill); div.appendChild(bar);
    return div;
  }));
  const warn = $("warn");
  warn.style.display = s.warnings.length ? "block" : "none";
  warn.textContent = s.warnings.length
    ? s.warnings.join(" ") + ` It stops automatically at ${s.stop_pct}% so this stays free.` : "";
}

// ---------- status polling, goodbye ----------
let goodbyePlayed = false;
async function poll() {
  try {
    const r = await fetch("api/status", { headers: HEADERS });
    if (!r.ok) throw new Error();
    const s = await r.json();
    $("name").textContent = s.name;
    document.title = s.name;
    const saved = $("saved");
    saved.textContent = s.last_saved ? `saved ${s.last_saved}` : "not saved yet";
    saved.classList.toggle("bad", !s.save_ok);
    if (!s.save_ok) saved.textContent += " (last save failed)";
    renderLimits(s);
    pollSec = s.poll_sec || pollSec;
    offline = false;
    if (s.start_url) { try { localStorage.setItem("pva_start_url", s.start_url); } catch (e) {} }
    showStart(false);
    if (s.state === "closing" && !goodbyePlayed) {
      goodbyePlayed = true; closed = true;
      stopPlayback();
      if (recorder && recorder.state === "recording") { recorder.onstop = null; recorder.stop(); }
      releaseMic();
      setState("ready", "Session closed, memory saved. Start it again, then tap the mic to reconnect.");
      showStart(true);
      const g = await fetch("api/goodbye", { headers: HEADERS });
      if (g.ok && playerUnlocked) enqueueAudio(await g.arrayBuffer(), turnId);
    }
  } catch (e) {
    if (closed) return;
    offline = true;
    setState("ready", "Jarvis is off. Start it, wait ~4 minutes, then tap the mic to connect.");
    showStart(true);
  }
}

// "Start Jarvis" button (your GitHub Start Jarvis page), remembered from the last
// time Jarvis was online, so it also works while Jarvis is off.
function showStart(visible) {
  let url = null;
  try { url = localStorage.getItem("pva_start_url"); } catch (e) {}
  const a = $("start");
  a.hidden = !(visible && url && /^https:\/\//.test(url));
  if (!a.hidden) a.href = url;
}

if ("serviceWorker" in navigator) {  // installable app + opens even while Jarvis is off
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

// Every status check is one request on the free ngrok plan (20,000/month). So: check
// every 60 s only while connected and the page is visible, and never while offline
// (a page left open all day would otherwise use up the month's requests).
let offline = false, pollSec = 60;
function schedulePoll() {
  setTimeout(async () => {
    if (closed || offline) return;
    if (!document.hidden) await poll();
    if (!closed && !offline) schedulePoll();
  }, pollSec * 1000);
}

async function reconnect() {
  closed = false; goodbyePlayed = false;
  setState("thinking", "Connecting…");
  await poll();
  if (!offline) { setState("ready", "Tap to talk"); ping(); schedulePoll(); }
}
reconnect();
</script>

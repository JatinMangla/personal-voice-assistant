<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root { --bg: #f6f7f9; --fg: #16181d; --muted: #6b7280; --card: #fff; --border: #e5e7eb; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --fg: #eceef2; --muted: #9aa1ad; --card: #181b21; --border: #262a33; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  input, button { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
  input { background: var(--bg); color: var(--fg); }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  #err { color: #dc2626; font-size: 14px; min-height: 1.2em; margin: 0; }
</style>
</head>
<body>
<form id="f">
  <h1>Sign in</h1>
  <input type="text" name="username" value="me" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required autofocus>
  <button type="submit">Sign in</button>
  <p id="err"></p>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("login", { method: "POST",
    headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" },
    body: JSON.stringify({ password: document.getElementById("pw").value }) });
  if (r.ok) location.href = "./";
  else document.getElementById("err").textContent = "Wrong password, or too many tries (wait 15 minutes).";
});
</script>
</body>
</html>
